name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      # El tag "latest-windows" es fijo y se reutiliza en cada build. Como el
      # nombre del instalador incluye la version (ej. TransformerSP_0.2.0_x64-setup.exe),
      # si no se borra el release anterior los assets de versiones viejas se
      # van acumulando ahi en vez de reemplazarse.
      - name: Borrar release anterior (se recrea limpio en este mismo build)
        run: gh release delete latest-windows --yes --cleanup-tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build y publicar (instalador + firma para el auto-updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: latest-windows
          releaseName: "TransformerSP (Windows) - último build"
          releaseBody: Instalador generado automáticamente desde el último commit en main. No requiere login para descargar. La app se actualiza sola con el botón "Buscar actualización".
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
