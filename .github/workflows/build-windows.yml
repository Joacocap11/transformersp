name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (Windows installers)
        run: npm run tauri build

      - name: Upload installers (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: TransformerSP-Windows-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish public release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: TransformerSP (Windows) - último build
          body: Instalador generado automáticamente desde el último commit en main. No requiere login para descargar.
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
